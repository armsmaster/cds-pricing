[project]
name = "cdslib"
version = "0.1.0"
description = "Minimal library for CDS pricing: term-structure tooling, generic OIS instruments and curve bootstrapping."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
]
notebook = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]
app = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdslib"]

[tool.hatch.build.targets.wheel.force-include]
"src/cdslib/data" = "cdslib/data"

[tool.ruff]
line-length = 105
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI uses Depends()/Query() in argument defaults by design.
"app/backend/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["scipy.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
